name: Release plugin zip

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  audit:
    uses: ./.github/workflows/security-audit.yml

  release:
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build plugin zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git archive --format=zip --prefix=make-my-site-agent-ready/ HEAD \
            assets includes make-my-site-agent-ready.php readme.txt uninstall.php vendor composer.json composer.lock \
            > "make-my-site-agent-ready-${VERSION}.zip"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: make-my-site-agent-ready-*.zip
          generate_release_notes: true
